name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build (release)
        run: swift build -c release
      - name: Validate eval set JSON
        run: python3 -c "import json; d=json.load(open('tests/polish_cases.json')); print(len(d), 'cases')"
